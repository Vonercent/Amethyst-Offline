name: Android CI

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: Amethyst-Android/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

#      - name: Get JRE17
#        uses: dawidd6/action-download-artifact@v9
#        with:
#          workflow: build.yml
#          path: Amethyst-Android/app_pojavlauncher/src/main/assets/components/jre-new
#          workflow_conclusion: success
#          repo: AngelAuraMC/angelauramc-openjdk-build
#          branch: buildjre17-21
#          name: jre17-pojav
#
#      - name: Get JRE21
#        uses: dawidd6/action-download-artifact@v9
#        with:
#          workflow: build.yml
#          path: Amethyst-Android/app_pojavlauncher/src/main/assets/components/jre-21
#          workflow_conclusion: success
#          repo: AngelAuraMC/angelauramc-openjdk-build
#          branch: buildjre17-21
#          name: jre21-pojav
#
#      - name: Get JRE25
#        uses: dawidd6/action-download-artifact@v9
#        with:
#          workflow: build.yml
#          path: app_pojavlauncher/src/main/assets/components/jre-25
#          workflow_conclusion: completed
#          repo: FCL-Team/Android-OpenJDK-Build
#          branch: Build_JRE_25
#          name: jre25-multiarch

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          cd Amethyst-Android
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./Amethyst-Android/keystore.jks
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./Amethyst-Android/app_pojavlauncher/keystore.jks

      - name: Patch files
        run: |
          patch ./Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/tasks/MinecraftDownloader.java MinecraftDownloader.patch
          patch ./Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/Tools.java Tools.patch
          patch ./Amethyst-Android/app_pojavlauncher/build.gradle app_pojavlauncher-gradle.patch

      - name: Build Release .apk
        run: |
          cd Amethyst-Android
          # Build the launcher
          gradle :app_pojavlauncher:assembleRelease
          mv app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/app-release.apk

      - name: Gen md5sums
        run: |
          cd Amethyst-Android
          md5sum out/app-release.apk > out/app-release.md5

      - name: Build Debug .apk
        run: |
          cd Amethyst-Android
          # Build the launcher
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Gen md5sums
        run: |
          cd Amethyst-Android
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug (recommended)
          path: Amethyst-Android/out/app-debug.*

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: Amethyst-Android/out/app-release.*


      - name: Release APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.run_id }}
          name: "android-${{ github.run_id }}"
          prerelease: true
          files: |
            Amethyst-Android/out/app-release.apk
            Amethyst-Android/out/app-release.md5
            Amethyst-Android/out/app-debug.apk
            Amethyst-Android/out/app-debug.md5

